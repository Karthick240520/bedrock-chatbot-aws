<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedrock Chat</title>
<style>
  :root {
    --bg: #eef2f6;
    --panel: #ffffff;
    --ink: #17212b;
    --muted: #5d6b7a;
    --line: #d5dde6;
    --me: #1f4f82;
    --me-ink: #ffffff;
    --bot: #f3f6f9;
    --accent: #1f4f82;
    --err: #a3261f;
    --code: #e6ecf2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f151b;
      --panel: #171f27;
      --ink: #e6ecf2;
      --muted: #93a1b0;
      --line: #2a3541;
      --me: #3b7cc4;
      --me-ink: #ffffff;
      --bot: #1e2832;
      --accent: #6aa6e6;
      --err: #ff8a80;
      --code: #26323e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 650; }
  header p { margin: 2px 0 0; font-size: .82rem; color: var(--muted); }
  #clear {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 6px 12px;
    border-radius: 8px;
    font: inherit;
    font-size: .85rem;
    cursor: pointer;
  }
  #clear:hover { border-color: var(--accent); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    max-width: 340px;
  }
  .empty strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 6px; }
  .msg {
    max-width: 88%;
    padding: 10px 14px;
    border-radius: 14px;
    overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.err { align-self: flex-start; color: var(--err); border: 1px solid var(--err); background: transparent; }
  .msg.bot > :first-child { margin-top: 0; }
  .msg.bot > :last-child { margin-bottom: 0; }
  .msg h3, .msg h4 { margin: .9em 0 .35em; line-height: 1.3; }
  .msg p { margin: .55em 0; }
  .msg ul, .msg ol { margin: .45em 0; padding-left: 1.3em; }
  .msg code { background: var(--code); padding: 1px 5px; border-radius: 5px; font-size: .9em; }
  .msg pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  .msg pre code { background: none; padding: 0; }
  .tablewrap { overflow-x: auto; margin: .6em 0; }
  .msg table { border-collapse: collapse; font-size: .9rem; }
  .msg th, .msg td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
  .msg th { background: var(--code); }
  .typing { color: var(--muted); font-style: italic; }
  form {
    display: flex;
    gap: 10px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1;
    resize: none;
    max-height: 140px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #send {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 10px;
    padding: 0 20px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  @media (max-width: 560px) { .msg { max-width: 94%; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Bedrock Chat</h1>
      <p>Powered by Amazon Nova 2 Lite</p>
    </div>
    <button id="clear" type="button">New chat</button>
  </header>

  <div id="log" aria-live="polite">
    <div class="empty" id="empty">
      <strong>Ask anything</strong>
      Type a question below. Press Enter to send, Shift+Enter for a new line.
    </div>
  </div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Type your message" aria-label="Message"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  // Your API Gateway endpoint
  const API_URL = "https://g51s9jc8c3.execute-api.us-east-1.amazonaws.com/chat";

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const clearBtn = document.getElementById("clear");

  // Conversation history in the Bedrock Converse format
  let messages = [];

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  }

  // Small markdown renderer: headings, lists, tables, code blocks, bold, inline code
  function render(md) {
    const lines = md.replace(/\r/g, "").split("\n");
    let out = "", i = 0;
    while (i < lines.length) {
      const line = lines[i];

      if (line.trim().startsWith("```")) {
        const buf = [];
        i++;
        while (i < lines.length && !lines[i].trim().startsWith("```")) buf.push(lines[i++]);
        i++;
        out += "<pre><code>" + esc(buf.join("\n")) + "</code></pre>";
        continue;
      }

      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
        const head = cells(line);
        i += 2;
        let rows = "";
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
          rows += "<tr>" + cells(lines[i]).map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>";
          i++;
        }
        out += '<div class="tablewrap"><table><thead><tr>' +
          head.map(c => "<th>" + inline(c) + "</th>").join("") +
          "</tr></thead><tbody>" + rows + "</tbody></table></div>";
        continue;
      }

      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        out += (h[1].length <= 2 ? "<h3>" : "<h4>") + inline(h[2]) + (h[1].length <= 2 ? "</h3>" : "</h4>");
        i++;
        continue;
      }

      if (/^\s*[-*]\s+/.test(line)) {
        let items = "";
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          items += "<li>" + inline(lines[i].replace(/^\s*[-*]\s+/, "")) + "</li>";
          i++;
        }
        out += "<ul>" + items + "</ul>";
        continue;
      }

      if (/^\s*\d+[.)]\s+/.test(line)) {
        let items = "";
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
          items += "<li>" + inline(lines[i].replace(/^\s*\d+[.)]\s+/, "")) + "</li>";
          i++;
        }
        out += "<ol>" + items + "</ol>";
        continue;
      }

      if (/^\s*(---|\*\*\*)\s*$/.test(line)) { i++; continue; }

      if (line.trim() === "") { i++; continue; }

      const para = [];
      while (i < lines.length && lines[i].trim() !== "" &&
             !/^(#{1,6}\s|\s*[-*]\s+|\s*\d+[.)]\s+|\s*\||\s*```)/.test(lines[i])) {
        para.push(lines[i++]);
      }
      out += "<p>" + inline(para.join(" ")) + "</p>";
    }
    return out;
  }

  function addMsg(cls, content, asHtml) {
    const empty = document.getElementById("empty");
    if (empty) empty.remove();
    const el = document.createElement("div");
    el.className = "msg " + cls;
    if (asHtml) el.innerHTML = content; else el.textContent = content;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function send(text) {
    messages.push({ role: "user", content: [{ text }] });
    addMsg("user", text);
    const wait = addMsg("bot typing", "Thinking…");
    sendBtn.disabled = true;

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages })
      });
      const data = await res.json();
      wait.remove();

      if (!res.ok || !data.reply) {
        messages.pop(); // keep history valid so the next try works
        addMsg("err", "The request failed (" + res.status + "). Check the Lambda logs in CloudWatch, then try again.");
      } else {
        messages.push({ role: "assistant", content: [{ text: data.reply }] });
        addMsg("bot", render(data.reply), true);
      }
    } catch (e) {
      wait.remove();
      messages.pop();
      addMsg("err", "Could not reach the API. Check the API URL and the CORS settings, then try again.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = "";
    input.style.height = "auto";
    send(text);
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  clearBtn.addEventListener("click", () => {
    messages = [];
    log.innerHTML = '<div class="empty" id="empty"><strong>Ask anything</strong>Type a question below. Press Enter to send, Shift+Enter for a new line.</div>';
    input.focus();
  });
</script>
</body>
</html>
